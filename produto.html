<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produto — OLYPORUS</title>
  <link rel="icon" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=JSON.parse(localStorage.getItem('olyporus:tema'));document.documentElement.dataset.tema=t||(matchMedia('(prefers-color-scheme: dark)').matches?'escuro':'claro');}catch(e){}</script>
</head>
<body data-pagina="produto">
  <a class="sr-only" href="#conteudo">Pular para o conteúdo</a>
  <div id="topo"></div>

  <!-- O conteúdo é montado pelo js/paginas/produto.js a partir do ?id= da URL -->
  <main id="conteudo" class="container">
    <p style="padding:80px 0">Carregando produto…</p>
  </main>

  <div id="rodape"></div>

  <script src="js/utils.js"></script>
  <script src="js/produtos.js"></script>
  <script src="js/carrinho.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/paginas/produto.js"></script>
</body>
</html>
